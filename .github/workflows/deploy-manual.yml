name: Manual Deploy to Firebase

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Dejar vacío para producción o poner un nombre para canal de prueba"
        required: false
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Build Angular
        run: |
          npm ci
          npm run build --if-present -- --configuration production

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_SALPICARTE_AR }}"
          # Corregido: Usamos comillas dobles afuera para permitir las simples adentro
          channelId: "${{ inputs.channel || 'live' }}"
          projectId: salpicarte-ar
