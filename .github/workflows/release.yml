name: Release on tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install & Build
        run: |
          npm ci
          npm run build --if-present -- --configuration production

      - name: Deploy to Firebase Production
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_SALPICARTE_AR }}"
          channelId: live
          projectId: salpicarte-ar

      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          # Ajustado a tu carpeta de salida real según tu primer mensaje
          zip -r artifacts/dist.zip dist/salpicarte-app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/dist.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
